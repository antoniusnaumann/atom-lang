name: Parser Tests

on:
  push:
    branches: [ main, master, parser-impl ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Parser Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Run unit tests
        run: |
          echo "Running parser unit tests..."
          cargo test --lib --verbose
      
      - name: Run corpus tests (test_all_files)
        run: |
          echo "Testing all .atom files in the corpus..."
          cargo run --example test_all_files
      
      - name: Check for warnings
        run: |
          echo "Checking for compiler warnings..."
          cargo clippy -- -D warnings
